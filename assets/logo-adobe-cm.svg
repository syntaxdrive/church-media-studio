<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Adobe Slate Background -->
    <linearGradient id="adobeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>

    <!-- Adobe Gold Border Gradient -->
    <linearGradient id="adobeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Letter Gradient -->
    <linearGradient id="adobeLetters" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="adobeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Adobe Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#adobeBg)" stroke="url(#adobeBorder)" stroke-width="16" filter="url(#adobeGlow)" />

  <!-- Subtle Inner Inset Line -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Adobe Mnemonic Text: Cm -->
  <text x="256" y="338" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="230" 
        font-weight="900" 
        fill="url(#adobeLetters)" 
        text-anchor="middle" 
        letter-spacing="-6px">Cm</text>
</svg>
